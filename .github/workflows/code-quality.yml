name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  BUILD_TYPE: Debug

jobs:
  # Format Check with clang-format
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    container:
      image: silkeh/clang:18

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show clang-format version
      run: clang-format --version

    - name: Run format check
      run: |
        chmod +x ./scripts/check-format.sh
        ./scripts/check-format.sh

  # Address Sanitizer
  asan:
    name: Address Sanitizer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git \
          pkg-config \
          libgoogle-perftools-dev

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          ~/.cache/vcpkg/archives
          vcpkg_installed
        key: ${{ runner.os }}-vcpkg-asan-${{ hashFiles('vcpkg.json') }}

    - name: Install vcpkg
      run: |
        # Clone vcpkg if it doesn't exist or is incomplete (not cached)
        if [ ! -f "vcpkg/vcpkg" ]; then
          echo "vcpkg not found or incomplete, cloning..."
          rm -rf vcpkg
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
        else
          echo "Using cached vcpkg"
        fi

    - name: Install vcpkg dependencies
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        ./vcpkg/vcpkg install --triplet=x64-linux-release

    - name: Configure CMake with ASan
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
          -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address"

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests with ASan
      working-directory: build
      run: |
        ctest --output-on-failure --verbose
      env:
        # exitcode=86 distinguishes a leak from a failing assertion: LSan's default
        # is 1, the same code a test returns when it fails, so the two are otherwise
        # indistinguishable in the log. halt_on_error=1 matters just as much as
        # detect_leaks=1 -- with detect_leaks alone the leak is reported but the
        # process still exits 0, which CI reads as a pass.
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:exitcode=86
        LSAN_OPTIONS: suppressions=../lsan.supp

  # Undefined Behavior Sanitizer
  ubsan:
    name: Undefined Behavior Sanitizer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git \
          pkg-config \
          libgoogle-perftools-dev

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          ~/.cache/vcpkg/archives
          vcpkg_installed
        key: ${{ runner.os }}-vcpkg-ubsan-${{ hashFiles('vcpkg.json') }}

    - name: Install vcpkg
      run: |
        # Clone vcpkg if it doesn't exist or is incomplete (not cached)
        if [ ! -f "vcpkg/vcpkg" ]; then
          echo "vcpkg not found or incomplete, cloning..."
          rm -rf vcpkg
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
        else
          echo "Using cached vcpkg"
        fi

    - name: Install vcpkg dependencies
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        ./vcpkg/vcpkg install --triplet=x64-linux-release

    - name: Configure CMake with UBSan
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DCMAKE_CXX_FLAGS="-fsanitize=undefined -g" \
          -DCMAKE_C_FLAGS="-fsanitize=undefined -g" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=undefined"

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests with UBSan
      working-directory: build
      run: |
        ctest --output-on-failure --verbose
      env:
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # Thread Sanitizer
  tsan:
    name: Thread Sanitizer
    runs-on: ubuntu-latest
    if: false  # Temporarily disabled

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git \
          pkg-config \
          libgoogle-perftools-dev

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          ~/.cache/vcpkg/archives
          vcpkg_installed
        key: ${{ runner.os }}-vcpkg-tsan-${{ hashFiles('vcpkg.json') }}

    - name: Install vcpkg
      run: |
        # Clone vcpkg if it doesn't exist or is incomplete (not cached)
        if [ ! -f "vcpkg/vcpkg" ]; then
          echo "vcpkg not found or incomplete, cloning..."
          rm -rf vcpkg
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
        else
          echo "Using cached vcpkg"
        fi

    - name: Install vcpkg dependencies
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        ./vcpkg/vcpkg install --triplet=x64-linux-release

    - name: Configure CMake with TSan
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
          -DCMAKE_C_FLAGS="-fsanitize=thread -g" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
          -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=thread"

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests with TSan
      working-directory: build
      run: |
        ctest --output-on-failure --verbose
      env:
        TSAN_OPTIONS: halt_on_error=0

  # Fuzzing (libFuzzer). Separate from the test jobs because it needs clang's
  # fuzzer runtime and runs on a time budget rather than to completion.
  fuzz:
    name: Fuzzing (libFuzzer)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          clang \
          git \
          pkg-config \
          libgoogle-perftools-dev

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          ~/.cache/vcpkg/archives
          vcpkg_installed
        key: ${{ runner.os }}-vcpkg-fuzz-${{ hashFiles('vcpkg.json') }}

    - name: Install vcpkg
      run: |
        if [ ! -f "vcpkg/vcpkg" ]; then
          echo "vcpkg not found or incomplete, cloning..."
          rm -rf vcpkg
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
        else
          echo "Using cached vcpkg"
        fi

    - name: Install vcpkg dependencies
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        ./vcpkg/vcpkg install --triplet=x64-linux-release

    - name: Configure with fuzz targets
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DREMOTE_PROFILER_BUILD_FUZZERS=ON \
          -DREMOTE_PROFILER_ENABLE_WEB=OFF \
          -DREMOTE_PROFILER_BUILD_TESTS=OFF \
          -DREMOTE_PROFILER_BUILD_EXAMPLES=OFF

    - name: Build fuzz targets
      run: |
        cd build
        make -j$(nproc)

    # The per-target tests replay the committed corpus (one run each), so this
    # fails if a corpus entry stops behaving. The smoke test then fuzzes past the
    # corpus for a bounded time.
    #
    # Both need the same environment the ASan job uses. tcmalloc's own
    # MallocExtension::Initialize() allocation is reported by LSan as a leak unless
    # lsan.supp is applied -- the first run of these steps failed on that 45-byte
    # allocation, not on anything the targets did.
    - name: Replay corpora
      working-directory: build
      run: |
        ctest -L fuzz --output-on-failure -E FuzzSmoke
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:exitcode=86
        LSAN_OPTIONS: suppressions=../lsan.supp

    - name: Fuzz smoke test
      working-directory: build
      run: |
        ctest -L fuzz --output-on-failure -R FuzzSmoke
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:exitcode=86
        LSAN_OPTIONS: suppressions=../lsan.supp

    # A crash leaves a reproducer behind; upload it so the failure is actionable
    # without re-running the job.
    - name: Upload crash reproducers
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-crashes
        path: |
          build/crash-*
          build/leak-*
          build/timeout-*
          build/oom-*
        if-no-files-found: ignore

  # Static Analysis with clang-tidy
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          clang-tidy \
          build-essential \
          git \
          pkg-config \
          libgoogle-perftools-dev

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          ~/.cache/vcpkg/archives
          vcpkg_installed
        key: ${{ runner.os }}-vcpkg-clang-tidy-${{ hashFiles('vcpkg.json') }}

    - name: Install vcpkg
      run: |
        if [ ! -f "vcpkg/vcpkg" ]; then
          echo "vcpkg not found or incomplete, cloning..."
          rm -rf vcpkg
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
        else
          echo "Using cached vcpkg"
        fi

    - name: Install vcpkg dependencies
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        ./vcpkg/vcpkg install --triplet=x64-linux-release

    - name: Configure CMake and generate compile_commands.json
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run clang-tidy
      run: |
        clang-tidy \
          -p build \
          src/*.cpp \
          include/*.h \
          2>&1 | tee clang-tidy-output.txt

    - name: Upload clang-tidy results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clang-tidy-results
        path: clang-tidy-output.txt

  # Build with all warnings as errors
  warnings-check:
    name: Warnings Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          git \
          pkg-config \
          libgoogle-perftools-dev

    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Cache vcpkg packages
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          ~/.cache/vcpkg/archives
          vcpkg_installed
        key: ${{ runner.os }}-vcpkg-warnings-${{ hashFiles('vcpkg.json') }}

    - name: Install vcpkg
      run: |
        # Clone vcpkg if it doesn't exist or is incomplete (not cached)
        if [ ! -f "vcpkg/vcpkg" ]; then
          echo "vcpkg not found or incomplete, cloning..."
          rm -rf vcpkg
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh
        else
          echo "Using cached vcpkg"
        fi

    - name: Install vcpkg dependencies
      env:
        VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      run: |
        ./vcpkg/vcpkg install --triplet=x64-linux-release

    - name: Configure with all warnings as errors
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=x64-linux-release \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
          -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"

    - name: Build
      run: |
        cd build
        make -j$(nproc)
